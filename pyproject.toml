[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "almuallim"
version = "1.0.0"
authors = [{ name = "Farhan Almutairi", email = "far7an.o88@gmail.com" }]
description = "Arabic code/security teaching engine."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

[project.scripts]
almuallim = "almuallim.cli:main"

[tool.setuptools]
packages = ["almuallim"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
